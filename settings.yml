# Prontera theme settings — exposed in Admin → Customize → Themes → Prontera.
# The forum lives on the root domain (prontera.info) and is shared by both
# whitelabel instances, so the interactive accent defaults to Verdigris.
# The instance seal colors (Banner Red / Gold) live on the portal cards.

accent_color:
  type: enum
  default: verdigris
  choices:
    - verdigris
    - banner_red
    - gold
  description: "Interactive accent (links, buttons, active tabs). Verdigris is the shared portal accent; Banner Red / Gold match the RO3 / ROZ seals."

parchment_texture:
  type: bool
  default: true
  description: "Show the subtle diagonal parchment texture behind the content, matching the Nuxt hub shell."

brand_wordmark:
  type: bool
  default: true
  description: "Render the site title in the Cinzel display font (brand wordmark). Topic titles always stay in Inter for readability."

# ---- Cookie consent + analytics (GA4) ----

consent_enabled:
  type: bool
  default: true
  description: "Show a cookie-consent banner. Analytics (GA4) load ONLY after the visitor accepts. A 'Cookie settings' link in the footer lets them change their choice later."

ga4_measurement_id:
  type: string
  default: ""
  description: "Google Analytics 4 measurement ID (e.g. G-XXXXXXXXXX). Loaded via gtag.js, but only after consent. Leave empty to disable analytics entirely. Keep Discourse's built-in GA setting empty so analytics are not loaded ungated."

umami_host:
  type: string
  default: "https://umami.imaginic.de"
  description: "Base URL of the self-hosted Umami instance (script.js and recorder.js are loaded from here). Loaded ONLY after the visitor consents to the Umami service. Leave empty to disable."

umami_website_id:
  type: string
  default: "ab0496f4-5d37-435e-bc83-c8db64e22db3"
  description: "Umami website ID (data-website-id). Leave empty to disable Umami."

privacy_policy_url:
  type: string
  default: "https://prontera.info/privacy"
  description: "URL of the privacy policy, linked from the consent banner."

# ---- Network shell (one navigation across forum and hubs) ----
#
# The forum is shared by both hubs. Which hub a page belongs to is read from
# its root category: everything under RO Zero Global is "roz", everything
# under Ragnarok Online 3 is "ro3". Pages outside both (homepage, Prontera,
# Staff) fall back to the game the visitor last looked at, else default_game.

network_bar_enabled:
  type: bool
  default: true
  description: "Thin network bar above the header: game switch (RO3 / Ragnarok Zero) and a link to the matching hub — the same bar the hubs show."

hub_nav_enabled:
  type: bool
  default: true
  description: "Show the hub's main navigation (Home, Database, Map, Guides, Tools, Build Planner, Community) beside the logo, plus the Community sub-navigation (Overview, Forum, Guilds, Raids, Marketplace) under the header. Desktop only; phones keep Discourse's own navigation."

default_game:
  type: enum
  default: roz
  choices:
    - roz
    - ro3
  description: "Hub the navigation points to on pages that belong to neither game."

roz_root_category_id:
  type: integer
  default: 32
  description: "ID of the top-level RO Zero Global category."

ro3_root_category_id:
  type: integer
  default: 8
  description: "ID of the top-level Ragnarok Online 3 category."

ro3_label:
  type: string
  default: "Ragnarok Online 3"
  description: "RO3 name in the network bar and brand subline."
ro3_url:
  type: string
  default: "https://ro3.prontera.info"
  description: "RO3 hub base URL (no trailing slash)."
ro3_marketplace:
  type: bool
  default: false
  description: "RO3 hub has the marketplace feature on (mirrors the hub's features.marketplace)."

roz_label:
  type: string
  default: "Ragnarok Zero"
  description: "ROZ name in the network bar and brand subline. Keep 'Ragnarok Zero' contiguous (hub SEO rule)."
roz_url:
  type: string
  default: "https://roz.prontera.info"
  description: "ROZ hub base URL (no trailing slash)."
roz_marketplace:
  type: bool
  default: true
  description: "ROZ hub has the marketplace feature on (mirrors the hub's features.marketplace)."

board_subline:
  type: string
  default: "Community Board"
  description: "Brand subline on pages that belong to neither game."
